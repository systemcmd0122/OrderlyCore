<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - OrderlyCore</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary: #5865F2; /* Discord Blurple */
            --bs-primary-rgb: 88, 101, 242;
        }
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-discord:hover {
            background-color: #4752c4;
            color: white;
        }
        .logo-text {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #212529;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #6c757d;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider:not(:empty)::before { margin-right: .5rem; }
        .divider:not(:empty)::after { margin-left: .5rem; }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <div class="card-body text-center">
            <h2 class="logo-text mb-4">[O] OrderlyCore</h2>
            <p class="text-secondary mb-4">Discordサーバーを管理するためにログインしてください。</p>

            <a href="/api/auth/discord" class="btn btn-discord w-100 mb-3 shadow-sm">
                <i class="bi bi-discord fs-5"></i>
                Discordでログイン
            </a>

            <div class="divider">または</div>

            <form id="login-form">
                <div class="mb-3 text-start">
                    <label for="token" class="form-label small fw-bold text-secondary">ワンタイムトークン</label>
                    <input type="text" id="token" class="form-control" placeholder="トークンを入力" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-outline-secondary w-100" id="submit-btn">
                    認証
                </button>
            </form>

            <div id="message-container" class="mt-3 small" style="display:none;">
                <div id="message" class="alert py-2"></div>
            </div>

            <div id="error-alert" class="alert alert-danger mt-3 py-2 small" style="display:none;">
                管理可能なサーバーが見つかりませんでした。
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error === 'no_manageable_guilds') {
                document.getElementById('error-alert').style.display = 'block';
            }

            const form = document.getElementById('login-form');
            const tokenInput = document.getElementById('token');
            const messageEl = document.getElementById('message');
            const msgWrap = document.getElementById('message-container');
            const submitBtn = document.getElementById('submit-btn');

            tokenInput.addEventListener('input', () => {
                if (tokenInput.value.trim().toLowerCase() === 'admin') {
                    window.location.href = '/admin-login.html';
                }
            });

            const showMsg = (text, type) => {
                msgWrap.style.display = 'block';
                messageEl.textContent = text;
                messageEl.className = 'alert py-2 alert-' + (type === 'success' ? 'success' : 'danger');
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const token = tokenInput.value.trim();
                if (!token) { showMsg('トークンを入力してください。', 'error'); return; }

                submitBtn.disabled = true;
                msgWrap.style.display = 'none';

                try {
                    const res = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        showMsg('認証成功！ダッシュボードに移動します...', 'success');
                        setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                    } else {
                        throw new Error(data.error || '不明なエラーが発生しました。');
                    }
                } catch (err) {
                    showMsg(err.message, 'error');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>

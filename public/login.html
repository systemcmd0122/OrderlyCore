<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderlyCore — ログイン</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="login-page-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">OrderlyCore</div>
            <p class="login-description">
                Discordサーバーで <code>/login</code> コマンドを実行して取得したワンタイムトークンを入力してください。
            </p>
            <form id="login-form">
                <div class="form-group">
                    <label for="token" class="login-label">ワンタイムトークン</label>
                    <div class="input-wrapper">
                        <i data-feather="key"></i>
                        <input type="text" id="token" name="token" required placeholder="トークンを貼り付け" autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="btn login-btn" id="submit-btn">
                    <span class="btn-text">認証</span>
                    <div class="loader-ring-small" style="display:none;"></div>
                </button>
            </form>
            <div id="message-container" style="display:none;">
                <p id="message"></p>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        feather.replace();

        const form = document.getElementById('login-form');
        const tokenInput = document.getElementById('token');

        tokenInput.addEventListener('input', () => {
            if (tokenInput.value.trim().toLowerCase() === 'admin') {
                window.location.href = '/admin-login.html';
            }
        });

        const messageEl = document.getElementById('message');
        const msgWrap = document.getElementById('message-container');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoader = submitBtn.querySelector('.loader-ring-small');

        const showMsg = (text, type) => {
            msgWrap.style.display = 'block';
            messageEl.textContent = text;
            messageEl.className = type;
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = tokenInput.value.trim();
            if (!token) { showMsg('トークンを入力してください。', 'error'); return; }

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            msgWrap.style.display = 'none';

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg('認証成功！ダッシュボードに移動します...', 'success');
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
                } else {
                    throw new Error(data.error || '認証に失敗しました。');
                }
            } catch (err) {
                showMsg('エラー: ' + err.message, 'error');
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
    });
    </script>
</body>
</html>

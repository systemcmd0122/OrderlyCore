<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理パネル - OrderlyCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8f9fa;
        }
        .admin-sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 1.5rem;
        }
        .admin-main {
            margin-left: 280px;
            padding: 2rem;
        }
        .nav-link {
            color: #8b949e;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-link:hover, .nav-link.active {
            color: white;
            background-color: #21262d;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1.5rem;
        }
        @media (max-width: 991.98px) {
            .admin-sidebar { display: none; }
            .admin-main { margin-left: 0; }
        }
    </style>
</head>
<body>

    <aside class="admin-sidebar">
        <h4 class="fw-bold mb-4 px-3"><i class="bi bi-shield-lock me-2 text-primary"></i>Admin</h4>
        <nav>
            <a href="#stats" class="nav-link active" data-page="stats"><i class="bi bi-cpu"></i> システム状況</a>
            <a href="#guilds" class="nav-link" data-page="guilds"><i class="bi bi-server"></i> サーバー一覧</a>
            <a href="#announce" class="nav-link" data-page="announce"><i class="bi bi-megaphone"></i> 全体お知らせ</a>
            <a href="#maintenance" class="nav-link" data-page="maintenance"><i class="bi bi-tools"></i> メンテナンス</a>
            <hr class="my-4 border-secondary opacity-25">
            <a href="/dashboard" class="nav-link"><i class="bi bi-arrow-left"></i> 戻る</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div id="admin-loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
        <div id="admin-content" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0" id="admin-page-title">システム状況</h3>
                <div id="bot-info-badge" class="badge bg-dark px-3 py-2 border"></div>
            </div>
            <div id="page-area"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="/admin.js"></script>
</body>
</html>

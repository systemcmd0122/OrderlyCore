<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderlyCore — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* Inline design system for standalone page */
        :root {
            --cyan: #00d9f5;
            --violet: #7c4dff;
            --bg-void: #070b1a;
            --bg-deep: #0b1025;
            --bg-base: #0f1535;
            --bg-raised: #141c40;
            --bg-float: #1a2350;
            --text-primary: #f0f3ff;
            --text-secondary: #a0a8cc;
            --text-muted: #5d6490;
            --border-subtle: rgba(255,255,255,0.04);
            --border-base: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.14);
            --success: #00e676;
            --error: #ff4d6a;
            --font-sans: 'Inter', 'Noto Sans JP', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
            --shadow-xl: 0 16px 64px rgba(0,0,0,0.65);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes blink { 50% { opacity: 0; } }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-void);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 0%, rgba(124,77,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 85% 90%, rgba(0,217,245,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-container { width: 100%; max-width: 460px; position: relative; z-index: 1; }

        .terminal {
            background: rgba(11, 16, 37, 0.92);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: var(--bg-raised);
            border-bottom: 1px solid var(--border-subtle);
        }
        .terminal-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }
        .terminal-title {
            flex: 1;
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 0.06em;
        }

        .terminal-body { padding: 36px 32px 32px; }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--cyan);
            text-shadow: 0 0 20px rgba(0,217,245,0.4);
            margin-bottom: 8px;
            text-align: center;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(124,77,255,0.12);
            border: 1px solid rgba(124,77,255,0.25);
            border-radius: 100px;
            padding: 3px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #a07aff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin: 0 auto 16px;
            display: flex;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .login-description {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 28px;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .form-group { margin-bottom: 22px; }
        .prompt {
            display: block;
            color: var(--cyan);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            margin-bottom: 10px;
        }
        .prompt::after { content: ' _'; animation: blink 1.2s steps(1) infinite; }

        .input-with-icon { position: relative; }
        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        input[type="password"] {
            width: 100%;
            padding: 11px 14px 11px 44px;
            background: var(--bg-raised);
            border: 1px solid var(--border-base);
            border-radius: var(--r-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: var(--font-mono);
            transition: all 0.15s ease;
            appearance: none;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(0,217,245,0.12);
            background: var(--bg-float);
        }
        input[type="password"]::placeholder { color: var(--text-muted); font-size: 0.87rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px;
            width: 100%;
            background: linear-gradient(135deg, rgba(0,217,245,0.9), rgba(124,77,255,0.9));
            border: none;
            border-radius: var(--r-sm);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all 0.15s ease;
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.12s;
        }
        .btn:hover:not(:disabled)::after { opacity: 1; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader-ring-small {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        #message-container { margin-top: 18px; text-align: center; min-height: 22px; }
        #message { font-weight: 600; font-size: 0.87rem; }
        #message.success { color: var(--success); }
        #message.error   { color: var(--error); }

        .back-to-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.15s;
        }
        .back-to-home:hover { color: var(--cyan); transform: translateX(-2px); }
        .back-to-home i { width: 15px; height: 15px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-dot dot-red"></div>
                <div class="terminal-dot dot-yellow"></div>
                <div class="terminal-dot dot-green"></div>
                <div class="terminal-title">OrderlyCore — admin-auth</div>
            </div>
            <div class="terminal-body">
                <h1 class="login-title">[O] Admin Panel</h1>
                <div class="admin-badge">
                    <i data-feather="shield" style="width:10px;height:10px;"></i>
                    RESTRICTED ACCESS
                </div>
                <p class="login-description">管理者パスワードを入力して認証してください。</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="password" class="prompt">admin@OrderlyCore:~$ sudo login</label>
                        <div class="input-with-icon">
                            <i data-feather="lock"></i>
                            <input type="password" id="password" name="password" required placeholder="管理者パスワード" autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn" id="submit-btn">
                        <span class="btn-text">Authenticate</span>
                        <div class="loader-ring-small" style="display:none;"></div>
                    </button>
                </form>
                <div id="message-container" style="display:none;">
                    <p id="message"></p>
                </div>
            </div>
        </div>
        <a href="/" class="back-to-home">
            <i data-feather="home"></i>
            <span>Return to Homepage</span>
        </a>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        feather.replace();

        const form       = document.getElementById('login-form');
        const passwordEl = document.getElementById('password');
        const messageEl  = document.getElementById('message');
        const msgWrap    = document.getElementById('message-container');
        const submitBtn  = document.getElementById('submit-btn');
        const btnText    = submitBtn.querySelector('.btn-text');
        const btnLoader  = submitBtn.querySelector('.loader-ring-small');

        const showMsg = (text, type) => {
            msgWrap.style.display = 'block';
            messageEl.textContent = text;
            messageEl.className = type;
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordEl.value;
            if (!password) { showMsg('パスワードを入力してください。', 'error'); return; }

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            msgWrap.style.display = 'none';

            try {
                const res  = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg('認証成功！管理パネルに移動します...', 'success');
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1400);
                } else {
                    throw new Error(data.error || '不明なエラー');
                }
            } catch (err) {
                showMsg(`エラー: ${err.message}`, 'error');
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
    });
    </script>
</body>
</html>

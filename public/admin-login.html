<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderlyCore — 管理ログイン</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .admin-header { color: var(--success); }
        .admin-input input { background: var(--bg-primary); border-color: rgba(63,185,80,0.3); color: var(--success); font-family: var(--font-mono); }
        .admin-input input:focus { border-color: var(--success); box-shadow: 0 0 0 2px rgba(63,185,80,0.15); }
        .admin-btn { background: var(--success); color: var(--bg-primary); }
        .admin-btn:hover { background: #4cda6a; }
    </style>
</head>
<body class="login-page-body">
    <div class="login-container">
        <div class="login-card" style="border-color: rgba(63,185,80,0.2);">
            <div class="login-logo admin-header">管理者パネル</div>
            <p class="login-description">管理者パスワードを入力してください。</p>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="password" class="login-label">パスワード</label>
                    <div class="input-wrapper admin-input">
                        <i data-feather="lock" style="color:var(--success);"></i>
                        <input type="password" id="password" name="password" required placeholder="管理者パスワード" autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="btn admin-btn login-btn" id="submit-btn">
                    <span class="btn-text">ログイン</span>
                    <div class="loader-ring-small" style="display:none;border-top-color:var(--bg-primary);"></div>
                </button>
            </form>
            <div id="message-container" style="display:none;">
                <p id="message"></p>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        feather.replace();

        const form = document.getElementById('admin-login-form');
        const passwordInput = document.getElementById('password');
        const messageEl = document.getElementById('message');
        const msgWrap = document.getElementById('message-container');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoader = submitBtn.querySelector('.loader-ring-small');

        const showMsg = (text, type) => {
            msgWrap.style.display = 'block';
            messageEl.textContent = text;
            messageEl.className = type;
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value.trim();
            if (!password) { showMsg('パスワードを入力してください。', 'error'); return; }

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            msgWrap.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg('認証成功！管理パネルに移動します...', 'success');
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1200);
                } else {
                    throw new Error(data.error || 'パスワードが違います。');
                }
            } catch (err) {
                showMsg('エラー: ' + err.message, 'error');
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ログイン - OrderlyCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #0d1117;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            color: #c9d1d9;
        }
        .form-control {
            background-color: #0d1117;
            border-color: #30363d;
            color: white;
        }
        .form-control:focus {
            background-color: #0d1117;
            color: white;
            border-color: #5865f2;
            box-shadow: 0 0 0 0.25rem rgba(88, 101, 242, 0.25);
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 shadow-lg">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                <h4 class="fw-bold mt-3">Admin Login</h4>
                <p class="text-secondary small">管理者パスワードを入力してください</p>
            </div>

            <form id="admin-login-form">
                <div class="mb-3">
                    <input type="password" id="password" class="form-control text-center" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
            </form>

            <div id="message" class="alert alert-danger mt-3 py-2 small text-center" style="display:none;"></div>

            <div class="text-center mt-4">
                <a href="/login" class="text-secondary text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>戻る</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/admin';
                } else {
                    messageEl.textContent = data.error || 'ログイン失敗';
                    messageEl.style.display = 'block';
                }
            } catch (err) {
                messageEl.textContent = 'エラーが発生しました';
                messageEl.style.display = 'block';
            }
        };
    </script>
</body>
</html>

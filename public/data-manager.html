<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ管理 - OrderlyCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }
        .container-main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1.5rem;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        pre {
            background-color: #f1f3f5;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .stat-badge {
            font-size: 0.75rem;
            padding: 0.35em 0.65em;
            border-radius: 2rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="bi bi-robot me-2 text-primary"></i>OrderlyCore
            </a>
            <div class="ms-auto">
                <a href="/dashboard" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>ダッシュボードに戻る
                </a>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="header-title">
            <h3 class="fw-bold mb-0">データ管理</h3>
            <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-3">Database Manager</span>
        </div>

        <div class="row g-4 mb-4" id="collections-summary">
            <!-- Summary cards will be injected here -->
        </div>

        <div class="card p-4">
            <h5 class="fw-bold mb-4">詳細ビューアー</h5>
            <div class="mb-4">
                <label class="form-label small fw-bold">コレクションを選択</label>
                <select id="collection-select" class="form-select">
                    <option value="">選択してください...</option>
                    <option value="levels">レベルデータ</option>
                    <option value="warnings">警告データ</option>
                    <option value="audit_logs">監査ログ</option>
                    <option value="quotes">引用データ</option>
                    <option value="roleboards">ロールボード</option>
                    <option value="tickets">チケット</option>
                </select>
            </div>

            <div id="collection-data-area">
                <div class="text-center py-5 text-secondary">
                    <i class="bi bi-database-fill-gear fs-1 opacity-25 d-block mb-3"></i>
                    コレクションを選択するとデータが表示されます。
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script src="/data-manager.js"></script>
</body>
</html>
